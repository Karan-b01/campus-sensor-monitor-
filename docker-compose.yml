services:
  timescaledb:
    # We use the official image bundled with PostgreSQL 16
    image: timescale/timescaledb:latest-pg16
    container_name: campus_timescaledb
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=campus_sensors
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_sensors"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campus_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
