services:
  timescaledb:
    # We use the official image bundled with PostgreSQL 16
    image: timescale/timescaledb:latest-pg16
    container_name: campus_timescaledb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=campus_sensors
    volumes:
      # This named volume ensures your data persists even if you destroy the container
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campus_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  timescaledb_data:
